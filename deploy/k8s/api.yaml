apiVersion: apps/v1
kind: Deployment
metadata:
  name: insightlm-api
  namespace: insightlm
  labels: {app.kubernetes.io/name: insightlm, app.kubernetes.io/component: api}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: insightlm, app.kubernetes.io/component: api}
  strategy:
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    metadata:
      labels: {app.kubernetes.io/name: insightlm, app.kubernetes.io/component: api}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: ghcr.io/example/insightlm-api:0.1.0
          ports: [{name: http, containerPort: 8000}]
          envFrom:
            - configMapRef: {name: insightlm-config}
            - secretRef: {name: insightlm-secrets}
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 15
            failureThreshold: 4
          # Four uvicorn processes per pod (WEB_CONCURRENCY): one process saturates a
          # core at ~90 req/s (docs/09). Requests sized for that.
          resources:
            requests: {cpu: "1", memory: 768Mi}
            limits: {cpu: "4", memory: 1536Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: insightlm-api
  namespace: insightlm
spec:
  selector: {app.kubernetes.io/name: insightlm, app.kubernetes.io/component: api}
  ports: [{name: http, port: 8000, targetPort: http}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: insightlm-api
  namespace: insightlm
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: insightlm-api}
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 65}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: insightlm-api
  namespace: insightlm
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: insightlm, app.kubernetes.io/component: api}
