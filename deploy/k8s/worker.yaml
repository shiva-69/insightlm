apiVersion: apps/v1
kind: Deployment
metadata:
  name: insightlm-worker
  namespace: insightlm
  labels: {app.kubernetes.io/name: insightlm, app.kubernetes.io/component: worker}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: insightlm, app.kubernetes.io/component: worker}
  template:
    metadata:
      labels: {app.kubernetes.io/name: insightlm, app.kubernetes.io/component: worker}
    spec:
      automountServiceAccountToken: false
      # Long enough for an in-flight ingestion step to finish; anything cut off is
      # recovered by the reaper (worker/main.py: requeue_stalled).
      terminationGracePeriodSeconds: 120
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: worker
          image: ghcr.io/example/insightlm-worker:0.1.0
          envFrom:
            - configMapRef: {name: insightlm-config}
            - secretRef: {name: insightlm-secrets}
          resources:
            requests: {cpu: 500m, memory: 768Mi}
            limits: {cpu: "2", memory: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
