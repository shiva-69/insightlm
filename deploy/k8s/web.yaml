apiVersion: apps/v1
kind: Deployment
metadata:
  name: insightlm-web
  namespace: insightlm
  labels: {app.kubernetes.io/name: insightlm, app.kubernetes.io/component: web}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: insightlm, app.kubernetes.io/component: web}
  template:
    metadata:
      labels: {app.kubernetes.io/name: insightlm, app.kubernetes.io/component: web}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 1001, seccompProfile: {type: RuntimeDefault}}  # the image's nextjs user
      containers:
        - name: web
          image: ghcr.io/example/insightlm-web:0.1.0
          ports: [{name: http, containerPort: 3000}]
          env:
            - {name: API_ORIGIN, value: http://insightlm-api:8000}
          readinessProbe:
            httpGet: {path: /login, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts: [{name: cache, mountPath: /app/.next/cache}]
      volumes: [{name: cache, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: insightlm-web
  namespace: insightlm
spec:
  selector: {app.kubernetes.io/name: insightlm, app.kubernetes.io/component: web}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: insightlm
  namespace: insightlm
  annotations:
    # Uploads of a few CVs at once; the API enforces its own per-file limit.
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
spec:
  ingressClassName: nginx
  tls: [{hosts: [insightlm.example.com], secretName: insightlm-tls}]
  rules:
    - host: insightlm.example.com
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: insightlm-web, port: {name: http}}}}
