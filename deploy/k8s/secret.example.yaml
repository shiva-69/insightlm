# An example only: never commit real values. Create the real Secret from your secret
# manager (e.g. External Secrets Operator) with these keys.
apiVersion: v1
kind: Secret
metadata:
  name: insightlm-secrets
  namespace: insightlm
type: Opaque
stringData:
  DATABASE_URL: postgresql+asyncpg://owner:CHANGE_ME@postgres.example:5432/insightlm
  DATABASE_APP_PASSWORD: CHANGE_ME
  REDIS_URL: rediss://:CHANGE_ME@redis.example:6380/0
  S3_ENDPOINT_URL: https://s3.example
  S3_ACCESS_KEY: CHANGE_ME
  S3_SECRET_KEY: CHANGE_ME
  JWT_SECRET: CHANGE_ME_64_RANDOM_BYTES
  GEMINI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
