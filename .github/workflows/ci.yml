name: CI

on:
  push: {branches: [main]}
  pull_request:

env:
  UV_VERSION: "0.5.11"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --all-groups --frozen

      - name: ruff (lint)
        run: uv run ruff check src tests migrations spikes scripts
      - name: ruff (format)
        run: uv run ruff format --check src tests migrations spikes scripts
      - name: mypy --strict
        run: uv run mypy

      # The architecture gate. A violation here is not a style nit -- it means a
      # dependency crossed a boundary that docs/02 says it cannot.
      - name: import-linter
        run: uv run lint-imports

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: insightlm
          POSTGRES_PASSWORD: insightlm
          POSTGRES_DB: insightlm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U insightlm"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://insightlm:insightlm@localhost:5432/insightlm
      JWT_SECRET: ci-secret-not-used-anywhere-real
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --all-groups --frozen

      - name: Unit and architecture tests
        run: uv run pytest tests/unit tests/architecture -q

      - name: Integration and security tests
        # The whole suite, so coverage counts unit tests too; greenlet-aware (pyproject).
        run: uv run pytest -q --cov --cov-report=term-missing --cov-fail-under=85

      # A non-empty autogenerate diff means a model changed without a migration.
      # Unglamorous, and exactly what production experience teaches you to gate on.
      - name: Migration drift
        run: |
          uv run alembic upgrade head
          uv run alembic check

  evaluation:
    name: Retrieval regression gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: insightlm
          POSTGRES_PASSWORD: insightlm
          POSTGRES_DB: insightlm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U insightlm"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://insightlm:insightlm@localhost:5432/insightlm
      S3_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      JWT_SECRET: ci-secret-not-used-anywhere-real
      # Deliberately keyless. The offline adapters are deterministic, so a drop here
      # is a real regression in the pipeline rather than model variance -- and a PR
      # gate that depends on a third-party API is a gate that fails for reasons the
      # PR did not cause. Provider-dependent numbers belong in a keyed nightly run.
      GENERATION_PROVIDER: offline
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with: {version: "${{ env.UV_VERSION }}", enable-cache: true}
      # A step, not a service container: services can't be given a command, and MinIO
      # without `server /data` prints its help and exits. Same digest as compose.yaml.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            cgr.dev/chainguard/minio@sha256:3b6e40c30ecd5cea627e382ff0b82ca841f58c52294578787043ee80c8ef7c82 \
            server /data
          for _ in $(seq 30); do
            curl -sf http://localhost:9000/minio/health/live && exit 0
            sleep 1
          done
          docker logs minio; exit 1
      - run: uv sync --all-groups --frozen
      - run: uv run alembic upgrade head

      # The threshold comes from eval/baselines.json, which records a measured run
      # rather than a guess. See the note in that file for why this gates nDCG and
      # not recall.
      - name: Golden set regression gate
        run: >-
          uv run insightlm-eval --config D-hybrid --corpus generated --count 40
          --min-ndcg 0.56 --no-cache --out eval-run.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-run
          path: eval-run.json

  security:
    name: Security scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}  # gitleaks reads every commit, not just the checkout
      - uses: astral-sh/setup-uv@v4
        with: {version: "${{ env.UV_VERSION }}", enable-cache: true}
      - run: uv sync --all-groups --frozen

      - name: pip-audit (dependency CVEs)
        run: uv run --with pip-audit pip-audit --strict || true
      # The whole history on every run, not the pushed range: a secret committed and
      # then deleted is still leaked. (The action scanned `before^..after`, which on a
      # repository's first push names a parent the root commit doesn't have.)
      - name: gitleaks (committed secrets)
        env: {GITLEAKS_VERSION: "8.24.3"}
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .
      - name: Trivy (filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          exit-code: "0"

  images:
    name: Build images
    runs-on: ubuntu-latest
    needs: [quality]
    strategy:
      matrix:
        target: [api, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
