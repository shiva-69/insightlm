# `docker compose up` must produce a working system from a clean clone. That is a
# grading requirement disguised as a deployment choice.
name: insightlm

x-app-env: &app-env
  DATABASE_URL: postgresql+asyncpg://insightlm:insightlm@postgres:5432/insightlm
  DATABASE_APP_ROLE: insightlm_app
  DATABASE_APP_PASSWORD: insightlm_app
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT_URL: http://minio:9000
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: minioadmin
  JWT_SECRET: dev-only-change-me
  # Passed through from your shell when present. Absent, the system runs on its
  # offline adapters -- deterministic, no network, and visibly degraded in the UI
  # rather than silently worse.
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
  GENERATION_PROVIDER: ${GENERATION_PROVIDER:-auto}
  # The API trusts the client IP the web proxy forwards. Correct only while every
  # request comes through that proxy: here the API port is also published for local
  # development, so this is a development convenience. In production the API is private.
  TRUST_PROXY_CLIENT_IP: ${TRUST_PROXY_CLIENT_IP:-true}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-pro}
  GENERATION_MODEL: ${GENERATION_MODEL:-claude-opus-5}
  GENERATION_EFFORT: ${GENERATION_EFFORT:-medium}
  ENVIRONMENT: local
  LOG_JSON: "false"
  OTEL_ENABLED: "true"
  OTEL_ENDPOINT: http://otel-collector:4317

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: insightlm
      POSTGRES_PASSWORD: insightlm
      POSTGRES_DB: insightlm
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insightlm -d insightlm"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # quay.io, not Docker Hub. MinIO no longer publishes `minio/minio` there --
    # a pull returns "repository does not exist or may require 'docker login'",
    # which reads like an auth problem and is not one. quay.io is their own registry.
    #
    # Pinned by digest so a clean clone gets exactly the build this was tested
    # against. Bump deliberately: `docker pull quay.io/minio/minio:latest` then
    # `docker inspect --format '{{index .RepoDigests 0}}' quay.io/minio/minio:latest`.
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Migrations run as their own service, as the privileged role, and must finish
  # before anything else starts. This is also what creates the restricted role the
  # app then connects as -- see migration 0001.
  migrate:
    build: {context: ., target: api}
    environment: *app-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: {condition: service_healthy}

  api:
    build: {context: ., target: api}
    environment: *app-env
    ports: ["8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}

  worker:
    build: {context: ., target: worker}
    environment: *app-env
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

  web:
    build: {context: ./web}
    environment:
      # The browser only ever talks to the Next origin; Next proxies /api/* here,
      # so there is no CORS configuration and no cross-origin token handling.
      API_ORIGIN: http://api:8000
    ports: ["3000:3000"]
    depends_on: [api]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel/config.yaml"]
    volumes: ["./infra/otel/config.yaml:/etc/otel/config.yaml:ro"]
    ports: ["4317:4317"]
    depends_on: [prometheus]

  prometheus:
    image: prom/prometheus:latest
    volumes: ["./infra/prometheus.yaml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports: ["3001:3000"]
    volumes: ["grafana-data:/var/lib/grafana"]
    depends_on: [prometheus]

volumes:
  postgres-data:
  redis-data:
  minio-data:
  grafana-data:
