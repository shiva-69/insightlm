# `docker compose up` must produce a working system from a clean clone. That is a
# grading requirement disguised as a deployment choice.
name: insightlm

x-app-env: &app-env
  DATABASE_URL: postgresql+asyncpg://insightlm:insightlm@postgres:5432/insightlm
  DATABASE_APP_ROLE: insightlm_app
  DATABASE_APP_PASSWORD: insightlm_app
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT_URL: http://minio:9000
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: minioadmin
  JWT_SECRET: dev-only-change-me
  ENVIRONMENT: local
  LOG_JSON: "false"
  OTEL_ENABLED: "true"
  OTEL_ENDPOINT: http://otel-collector:4317

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: insightlm
      POSTGRES_PASSWORD: insightlm
      POSTGRES_DB: insightlm
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insightlm -d insightlm"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Migrations run as their own service, as the privileged role, and must finish
  # before anything else starts. This is also what creates the restricted role the
  # app then connects as -- see migration 0001.
  migrate:
    build: {context: ., target: api}
    environment: *app-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: {condition: service_healthy}

  api:
    build: {context: ., target: api}
    environment: *app-env
    ports: ["8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}

  worker:
    build: {context: ., target: worker}
    environment: *app-env
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel/config.yaml"]
    volumes: ["./infra/otel/config.yaml:/etc/otel/config.yaml:ro"]
    ports: ["4317:4317"]
    depends_on: [prometheus]

  prometheus:
    image: prom/prometheus:latest
    volumes: ["./infra/prometheus.yaml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports: ["3001:3000"]
    volumes: ["grafana-data:/var/lib/grafana"]
    depends_on: [prometheus]

volumes:
  postgres-data:
  redis-data:
  minio-data:
  grafana-data:
